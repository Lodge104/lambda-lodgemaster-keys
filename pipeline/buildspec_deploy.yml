version: 0.2
# LodgeMaster credentials are no longer resolved here: ScrapperFunction reads
# them directly from SSM Parameter Store (SecureString) at runtime using its
# own execution role, so this deploy stage no longer needs read access to
# those parameters at all.
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --upgrade pip
      - pip install --upgrade awscli aws-sam-cli
  build:
    commands:
      - . ./assume-role.sh ${ENV_PIPELINE_EXECUTION_ROLE} deploy
      - >
        sam deploy --stack-name ${ENV_STACK_NAME}
        --template ${ENV_TEMPLATE}
        --capabilities CAPABILITY_NAMED_IAM
        --region ${ENV_REGION}
        --s3-bucket ${ENV_BUCKET}
        --no-fail-on-empty-changeset
        --role-arn ${ENV_CLOUDFORMATION_EXECUTION_ROLE}
        --parameter-overrides
        "ScheduleState=${SCHEDULE_STATE}"
